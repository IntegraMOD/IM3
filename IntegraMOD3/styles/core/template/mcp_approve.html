<!-- INCLUDE overall_header.html -->

<form id="confirm" action="{S_CONFIRM_ACTION}" method="post">
    <section class="ucp-card">
        <div class="ucp-card-body">
            {S_FORM_TOKEN}
            <h2>{MESSAGE_TITLE}</h2>
            <!-- IF ADDITIONAL_MSG --><p class="error">{ADDITIONAL_MSG}</p><!-- ENDIF -->
            <div class="ucp-form-grid">
                <!-- IF S_NOTIFY_POSTER -->
                <div class="ucp-form-row">
                    <label><input type="checkbox" name="notify_poster" checked="checked" /> <!-- IF S_APPROVE -->{L_NOTIFY_POSTER_APPROVAL}<!-- ELSE -->{L_NOTIFY_POSTER_DISAPPROVAL}<!-- ENDIF --></label>
                </div>
                <!-- ENDIF -->
                <!-- IF not S_APPROVE -->
                <div class="ucp-form-row">
                    <p class="ucp-form-label">{L_DISAPPROVE_REASON}:</p>
                    <select name="reason_id" class="ucp-form-select">
                        <!-- BEGIN reason --><option value="{reason.ID}"<!-- IF reason.S_SELECTED --> selected="selected"<!-- ENDIF -->>{reason.DESCRIPTION}</option><!-- END reason -->
                    </select>
                </div>
                <div class="ucp-form-row">
                    <label class="ucp-form-label" for="reason">{L_MORE_INFO}:</label>
                    <p class="ucp-form-help">{L_CAN_LEAVE_BLANK}</p>
                    <textarea class="inputbox ucp-form-textarea" name="reason" id="reason" rows="4" cols="40">{REASON}</textarea>
                </div>
                <!-- ENDIF -->
                <p><strong>{MESSAGE_TEXT}</strong></p>
                <div class="ucp-actions">
                    {S_HIDDEN_FIELDS}<input type="submit" name="confirm" value="{YES_VALUE}" class="button1" />
                    <input type="submit" name="cancel" value="{L_NO}" class="button2" />
                </div>
            </div>
        </div>
    </section>
</form>

<!-- INCLUDE overall_footer.html -->
