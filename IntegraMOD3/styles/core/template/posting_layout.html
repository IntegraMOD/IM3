<!-- INCLUDE overall_header.html -->

<!-- IF TOPIC_TITLE -->
    <h2 class="solo posting-title"><a href="{U_VIEW_TOPIC}">{TOPIC_TITLE}</a></h2>
<!-- ELSE -->
    <h2 class="solo posting-title"><a href="{U_VIEW_FORUM}">{FORUM_NAME}</a></h2>
 <!-- ENDIF -->

<!-- IF S_FORUM_RULES -->
    <section class="ucp-card rules posting-rules">
        <div class="ucp-card-body">
		<!-- IF U_FORUM_RULES -->
			<a href="{U_FORUM_RULES}">{L_FORUM_RULES}</a>
		<!-- ELSE -->
			<strong>{L_FORUM_RULES}</strong><br />
			{FORUM_RULES}
		<!-- ENDIF -->
        </div>
    </section>
<!-- ENDIF -->

<form id="postform" method="post" action="{S_POST_ACTION}"{S_FORM_ENCTYPE} data-apply-onkeypress="1">

<!-- IF S_DRAFT_LOADED -->
    <section class="ucp-card posting-info">
        <div class="ucp-card-header">
            <h3 class="ucp-card-title">{L_INFORMATION}</h3>
        </div>
        <div class="ucp-card-body">
		<p>{L_DRAFT_LOADED}</p>
        </div>
    </section>
<!-- ENDIF -->

<!-- IF S_SHOW_DRAFTS --><!-- INCLUDE drafts.html --><!-- ENDIF -->

<!-- IF S_POST_REVIEW --><!-- INCLUDE posting_review.html --><!-- ENDIF -->

<!-- IF S_UNGLOBALISE -->
    <section class="ucp-card posting-unglobalise">
        <div class="ucp-card-header">
            <h3 class="ucp-card-title">{L_SELECT_DESTINATION_FORUM}</h3>
        </div>
        <div class="ucp-card-body">
        <fieldset class="fields1 ucp-form-grid">
			<p>{L_UNGLOBALISE_EXPLAIN}</p>
            <div class="ucp-form-row">
                <label class="ucp-form-label" for="to_forum_id">{L_MOVE}:</label>
                <select class="ucp-form-select" id="to_forum_id" name="to_forum_id">{S_FORUM_SELECT}</select>
            </div>
			
            <div class="ucp-actions">
                <input class="button1" type="submit" name="post" value="{L_CONFIRM}" />
                <input class="button2" type="submit" name="cancel_unglobalise" value="{L_CANCEL}" />
            </div>
		</fieldset>
        </div>
    </section>
<!-- ENDIF -->

<!-- IF S_DISPLAY_PREVIEW --><!-- INCLUDE posting_preview.html --><!-- ENDIF -->

<section class="ucp-card posting-card" id="postingbox">
    <div class="ucp-card-header">
        <h3 class="ucp-card-title">{L_POST_A}</h3>
    </div>
    <div class="ucp-card-body">

	<!-- DEFINE $EXTRA_POSTING_OPTIONS = 1 -->
	<!-- INCLUDE posting_editor.html -->
	{S_FORM_TOKEN}
    </div>
</section>

<!-- IF S_DISPLAY_REVIEW --><!-- INCLUDE posting_topic_review.html --><!-- ENDIF -->

</form>
<!-- INCLUDE overall_footer.html -->
