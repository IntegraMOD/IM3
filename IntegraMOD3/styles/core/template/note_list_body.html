<!-- IF S_NOTES_POPUP -->
    <!-- INCLUDE simple_header.html -->
<!-- ELSE -->
    <!-- INCLUDE overall_header.html -->
<!-- ENDIF -->

<form action="{S_FORM_ACTION}" method="post" id="notes">
    <section class="ucp-card">
        <div class="ucp-card-body">
            <div class="topic-actions">
                <div><strong>{L_NOTES}</strong> &bull; {L_NOTES_TOTAL}</div>
                <!-- IF S_NEW_NOTE --><div class="rightside"><a href="{U_NEW_NOTE}">{L_ADD_NOTE}</a></div><!-- ENDIF -->
            </div>
            <div class="ucp-actions">
                <label>{SEARCH_IN} <input type="text" name="search_string" size="30" maxlength="50" class="inputbox autowidth ucp-form-input" /></label>
                <input type="submit" class="button2" value="{L_SEARCH}" />
                <label>{SORT_BY} {SORT_ORDER}</label>
                <input type="submit" class="button2" value="{L_SORT}" />
            </div>
        </div>
    </section>
</form>

<!-- IF L_FILTER -->
<p><em>* {L_FILTER}</em></p>
<!-- ENDIF -->

<h2>{L_NOTES}</h2>

<!-- IF S_NO_NOTES -->
    <section class="ucp-card">
        <div class="ucp-card-body">
            <h3>{L_NO_NOTES}</h3>
        </div>
    </section>
<!-- ELSE -->
    <!-- BEGIN notes_row -->
    <article class="ucp-card note-item <!-- IF notes_row.S_ROW_COUNT is odd -->bg1<!-- ELSE -->bg2<!-- ENDIF -->">
        <div class="ucp-card-body">
            <h3>{notes_row.NOTE_SUBJECT}</h3>
            <!-- IF notes_row.NOTES_MEM --><p class="post-rules"><strong>{L_NOTES_MEM}: </strong>{notes_row.NOTES_MEM}</p><!-- ENDIF -->
            <div class="content">{notes_row.NOTE_TEXT}</div>
            <p class="author"><strong>{L_POSTED}:</strong> {notes_row.NOTE_DATE}</p>
            <p>
                <a href="{notes_row.U_EDIT_NOTE}" title="{L_EDIT_NOTE}">{L_EDIT_NOTE}</a> &bull;
                <a href="{notes_row.U_DELETE_NOTE}" title="{L_DELETE_NOTE}">{L_DELETE_NOTE}</a>
            </p>
        </div>
    </article>
    <!-- END notes_row -->
<!-- ENDIF -->

<section class="ucp-card">
    <div class="ucp-card-body">
        <div class="topic-actions">
            <div><strong>{L_NOTES}</strong> &bull; {L_NOTES_TOTAL}</div>
            <!-- IF S_NEW_NOTE --><div class="rightside"><a href="{U_NEW_NOTE}">{L_ADD_NOTE}</a></div><!-- ENDIF -->
        </div>
    </div>
</section>

<!-- IF S_NOTES_POPUP -->
    <p class="ucp-actions">
        <input type="button" class="button1" value="{L_CLOSE}" data-action="close-window" />
    </p>
    <!-- INCLUDE simple_footer.html -->
<!-- ELSE -->
    <!-- INCLUDE overall_footer.html -->
<!-- ENDIF -->
