<!-- INCLUDE dl_mod/dl_header.html -->

<form action="{S_CONFIRM_ACTION}" method="post" id="confirm">
	<section class="ucp-card">
		<div class="ucp-card-header">
			<h2 class="ucp-card-title">{MESSAGE_TITLE}</h2>
		</div>
		<div class="ucp-card-body">
			<p>{MESSAGE_TEXT}</p>
			<!-- IF S_DELETE_FILES_CONFIRM -->
			<div class="ucp-form-row">
				<label>{L_DL_DELETE_FILE_CONFIRM}</label>
				<input type="checkbox" class="permissions-checkbox" name="del_file" value="1" />
			</div>
			<!-- ENDIF -->
			<!-- IF S_CHOOSE_NEW_CAT -->
			<div class="ucp-form-row">
				<span class="ucp-form-label">{L_SWITCH_CAT}</span>
				<div class="ucp-form-content">{S_SWITCH_CAT}</div>
			</div>
			<!-- ENDIF -->
			<div class="ucp-actions">
				<input type="submit" name="confirm" value="{L_YES}" class="button1" />
				<input type="submit" name="cancel" value="{L_NO}" class="button2" />
			</div>
			{S_FORM_TOKEN}
			{S_HIDDEN_FIELDS}
		</div>
	</section>
</form>

<!-- INCLUDE dl_mod/dl_footer.html -->
