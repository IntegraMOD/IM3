<!-- INCLUDE ucp_header.html -->

<form id="ucp" method="post" action="{S_UCP_ACTION}"{S_FORM_ENCTYPE}>

<h2>{L_TITLE}</h2>

<!-- IF ERROR -->
    <p class="error">{ERROR}</p>
<!-- ENDIF -->

<section class="ucp-zebra-section">
    <div class="forum-header">
        <div class="forum-title">{L_YOUR_FOES}</div>
    </div>
    <div class="index-stat-body">
        <p class="ucp-zebra-explain">{L_FOES_EXPLAIN}</p>
        <div class="ucp-zebra-field">
            <label class="ucp-zebra-label" <!-- IF S_USERNAME_OPTIONS -->for="usernames"<!-- ENDIF -->>{L_YOUR_FOES}</label>
            <p class="ucp-zebra-description">{L_YOUR_FOES_EXPLAIN}</p>
            <!-- IF S_USERNAME_OPTIONS -->
                <select name="usernames[]" id="usernames" multiple="multiple" size="5">{S_USERNAME_OPTIONS}</select>
            <!-- ELSE -->
                <p class="ucp-zebra-empty">{L_NO_FOES}</p>
            <!-- ENDIF -->
        </div>
        <div class="ucp-zebra-field">
            <label class="ucp-zebra-label" for="add">{L_ADD_FOES}</label>
            <p class="ucp-zebra-description">{L_ADD_FOES_EXPLAIN}</p>
            <textarea name="add" id="add" rows="3" cols="30" class="inputbox">{USERNAMES}</textarea>
            <a class="ucp-zebra-find-user" href="{U_FIND_USERNAME}" data-find-username>{L_FIND_USERNAME}</a>
        </div>
    </div>
</section>

<div class="ucp-zebra-actions">
    {S_HIDDEN_FIELDS}
    <input type="reset" value="{L_RESET}" name="reset" class="button2" />
    <input type="submit" name="submit" value="{L_SUBMIT}" class="button1" />
    {S_FORM_TOKEN}
</div>

</form>

<!-- INCLUDE ucp_footer.html -->
