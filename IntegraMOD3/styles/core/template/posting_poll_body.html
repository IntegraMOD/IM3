<section class="ucp-card posting-poll" id="poll-panel">
    <div class="ucp-card-body ucp-form-grid">

	<!-- IF S_SHOW_POLL_BOX -->
	<p>{L_ADD_POLL_EXPLAIN}</p>
	<!-- ENDIF -->

    <fieldset class="fields2 ucp-form-grid">
	<!-- IF S_SHOW_POLL_BOX -->
		<!-- IF S_POLL_DELETE -->
			<div class="ucp-form-row">
				<div class="ucp-form-label"><label for="poll_delete">{L_POLL_DELETE}:</label></div>
				<div class="ucp-form-content"><label for="poll_delete"><input type="checkbox" name="poll_delete" id="poll_delete"<!-- IF S_POLL_DELETE_CHECKED --> checked="checked"<!-- ENDIF --> /> </label></div>
			</div>
		<!-- ENDIF -->
		<div class="ucp-form-row">
			<div class="ucp-form-label"><label for="poll_title">{L_POLL_QUESTION}:</label></div>
			<div class="ucp-form-content"><input type="text" name="poll_title" id="poll_title" maxlength="255" value="{POLL_TITLE}" class="inputbox ucp-form-input" /></div>
		</div>
		<div class="ucp-form-row">
			<div class="ucp-form-label"><label for="poll_option_text">{L_POLL_OPTIONS}:</label><br /><span class="ucp-form-help">{L_POLL_OPTIONS_EXPLAIN}</span></div>
			<div class="ucp-form-content"><textarea name="poll_option_text" id="poll_option_text" rows="5" cols="35" class="inputbox ucp-form-textarea">{POLL_OPTIONS}</textarea></div>
		</div>

		<hr class="dashed" />

		<div class="ucp-form-row">
			<div class="ucp-form-label"><label for="poll_max_options">{L_POLL_MAX_OPTIONS}:</label><br /><span class="ucp-form-help">{L_POLL_MAX_OPTIONS_EXPLAIN}</span></div>
			<div class="ucp-form-content"><input type="text" name="poll_max_options" id="poll_max_options" size="3" maxlength="3" value="{POLL_MAX_OPTIONS}" class="inputbox autowidth" /></div>
		</div>
		<div class="ucp-form-row">
			<div class="ucp-form-label"><label for="poll_length">{L_POLL_FOR}:</label><br /><span class="ucp-form-help">{L_POLL_FOR_EXPLAIN}</span></div>
			<div class="ucp-form-content"><label for="poll_length"><input type="text" name="poll_length" id="poll_length" size="3" maxlength="3" value="{POLL_LENGTH}" class="inputbox autowidth" /> {L_DAYS}</label></div>
		</div>

		<!-- IF S_POLL_VOTE_CHANGE -->
			<hr class="dashed" />
			<div class="ucp-form-row">
				<div class="ucp-form-label"><label for="poll_vote_change">{L_POLL_VOTE_CHANGE}:</label></div>
				<div class="ucp-form-content"><label for="poll_vote_change"><input type="checkbox" id="poll_vote_change" name="poll_vote_change"{VOTE_CHANGE_CHECKED} /> {L_POLL_VOTE_CHANGE_EXPLAIN}</label></div>
			</div>
		<!-- ENDIF -->

	<!-- ELSEIF S_POLL_DELETE -->
		<div class="ucp-form-row">
			<div class="ucp-form-label"><label for="poll_delete">{L_POLL_DELETE}:</label></div>
			<div class="ucp-form-content"><label for="poll_delete"><input type="checkbox" name="poll_delete" id="poll_delete"<!-- IF S_POLL_DELETE_CHECKED --> checked="checked"<!-- ENDIF --> /> </label></div>
		</div>
	<!-- ENDIF -->
	</fieldset>

    </div>
</section>
