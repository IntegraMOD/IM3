<!-- INCLUDE overall_header.html -->

<form id="confirm" action="{S_CONFIRM_ACTION}" method="post">
    <section class="ucp-card">
        <div class="ucp-card-body">
            <h2>{MESSAGE_TITLE}</h2>
            <!-- IF ADDITIONAL_MSG --><p>{ADDITIONAL_MSG}</p><!-- ENDIF -->
            <div class="ucp-form-grid">
                <div class="ucp-form-row">
                    <p class="ucp-form-label">{L_SELECT_DESTINATION_FORUM}:</p>
                    <select name="to_forum_id" class="ucp-form-select">{S_FORUM_SELECT}</select>
                    <!-- IF S_CAN_LEAVE_SHADOW --><p><label for="move_leave_shadow"><input type="checkbox" name="move_leave_shadow" id="move_leave_shadow" checked="checked" /> {L_LEAVE_SHADOW}</label></p><!-- ENDIF -->
                </div>
                <p><strong>{MESSAGE_TEXT}</strong></p>
            </div>
            <div class="ucp-actions">
                {S_HIDDEN_FIELDS}<input type="submit" name="confirm" value="{YES_VALUE}" class="button1" />
                <input type="submit" name="cancel" value="{L_NO}" class="button2" />
                {S_FORM_TOKEN}
            </div>
        </div>
    </section>
</form>

<!-- INCLUDE overall_footer.html -->
