<section class="stat-block donation-stats">
	<!-- IF U_DONATE --><h3><a href="{U_DONATE}">{L_DONATION_INDEX}</a></h3><!-- ELSE --><h3>{L_DONATION_INDEX}</h3><!-- ENDIF -->

	<!-- IF S_GOAL_NUMBER -->
		<div class="prog_grey"><div class="prog_green" style="width:{DONATION_GOAL_NUMBER}%;"><span class="progress">{DONATION_GOAL_NUMBER}%</span></div></div>
	<!-- ENDIF -->

	<p class="donation_stats">
		<!-- IF DONATION_RAISED_ENABLE -->
			{L_DONATION_RAISED}<!-- IF DONATION_USED_ENABLE --><br /><!-- ENDIF -->
		<!-- ENDIF -->
		<!-- IF DONATION_GOAL_ENABLE -->
			{L_DONATION_GOAL}
		<!-- ENDIF -->
	</p>

	<!-- IF S_USED_NUMBER -->
		<div class="prog_grey"><div class="prog_red" style="width:{DONATION_USED_NUMBER}%;"><span class="progress">{DONATION_USED_NUMBER}%</span></div></div>
	<!-- ENDIF -->

	<!-- IF DONATION_USED_ENABLE -->
	<p class="donation_stats">
		{L_DONATION_USED}
	</p>
	<!-- ENDIF -->
</section>
