<section class="ucp-card posting-who-posted-info">
    <div class="ucp-card-header">
        <h3 class="ucp-card-title">{L_WHOPOSTED_TITLE}</h3>
    </div>
    <div class="ucp-card-body">
	
	{L_WHOPOSTED_EXP}
	
    </div>
</section>

<section class="ucp-card posting-who-posted-list">
    <div class="ucp-card-body">
	
	<table class="table1" cellspacing="1">
	<thead>
		<tr>
			<th class="name">{L_USERNAME}</th>
			<th class="active">{L_POSTS}</th>
		</tr>
	</thead>
	<tbody>
		<!-- BEGIN who_posted_row -->
		<tr class="<!-- IF who_posted_row.S_ROW_COUNT is odd -->bg1<!-- ELSE -->bg2<!-- ENDIF -->">
			<td<!-- IF who_posted_row.USERNAME_PLAIN --> title="{who_posted_row.USERNAME_PLAIN}"<!-- ENDIF -->>{who_posted_row.USERNAME}</td>
			<td class="active">{who_posted_row.POSTS}</td>
		</tr>
		<!-- END who_posted_row -->
	</tbody>
	</table>
	
    </div>
</section>

<section class="ucp-card posting-who-posted-actions">
    <div class="ucp-card-body ucp-actions">
	
	<a class="nav" href="{U_CLOSE}" onclick="opener.location=(this.href); self.close();">{L_WHOPOSTED_SHOW}</a> {L_WHOPOSTED_OR} <a class="nav" href="#" onclick="window.close(); return false;">{L_CLOSE_WINDOW}</a>
	
    </div>
</section>

<!-- INCLUDE simple_footer.html -->
