<!-- INCLUDE overall_header.html -->

<!-- IF FORUM_NAME --><h2><a href="{U_VIEW_FORUM}">{FORUM_NAME}</a></h2><!-- ENDIF -->

<form id="login_forum" method="post" action="{S_LOGIN_ACTION}" class="ucp-form-grid login-form-grid">
    <div class="ucp-card">
        <div class="ucp-card-body">
            <h2>{L_LOGIN}</h2>
            <p>{L_LOGIN_FORUM}</p>

            <div class="ucp-form-grid login-form-grid">
                <!-- IF LOGIN_ERROR --><p class="error">{LOGIN_ERROR}</p><!-- ENDIF -->

                <div class="ucp-form-row">
                    <label class="ucp-form-label" for="password">{L_PASSWORD}</label>
                    <input type="password" tabindex="1" id="password" name="password" size="25" class="inputbox ucp-form-input" autofocus />
                </div>

                {S_LOGIN_REDIRECT}

                <div class="ucp-actions">
                    {S_HIDDEN_FIELDS}
                    <input type="submit" name="login" id="login" class="button1 default-submit-action" value="{L_LOGIN}" tabindex="2" />
                </div>
            </div>
        </div>
    </div>
</form>

<!-- INCLUDE jumpbox.html -->
