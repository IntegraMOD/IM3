<!-- INCLUDE ucp_header.html -->

<form id="postform" method="post" action="{S_UCP_ACTION}"{S_FORM_ENCTYPE}>

<h2>{L_TITLE}</h2>

<div class="ucp-card">
	<div class="ucp-card-body">
		<p>{L_DRAFTS_EXPLAIN}</p>

<!-- IF S_EDIT_DRAFT -->
		<!-- INCLUDE posting_editor.html -->
	</div>
</div>

<div class="ucp-card">
	<div class="ucp-card-body">
		<div class="ucp-actions">
			{S_HIDDEN_FIELDS}
			<input type="reset" value="{L_RESET}" name="reset" class="button2" />
			<input type="submit" name="submit" value="{L_SAVE}" class="button1" />
		</div>
		{S_FORM_TOKEN}
	</div>
</div>

<!-- ELSE -->

	<!-- IF .draftrow -->
		<div class="ucp-form-grid">
		<!-- BEGIN draftrow -->
			<div class="ucp-form-row<!-- IF draftrow.S_ROW_COUNT is odd --> bg1<!-- ELSE --> bg2<!-- ENDIF -->">
				<p class="ucp-form-label"><a class="topictitle" href="{draftrow.U_VIEW_EDIT}">{draftrow.DRAFT_SUBJECT}</a></p>
				<p class="ucp-form-help">
					<!-- IF draftrow.S_LINK_TOPIC -->{L_TOPIC}: <a href="{draftrow.U_VIEW}">{draftrow.TITLE}</a>
					<!-- ELSEIF draftrow.S_LINK_FORUM -->{L_FORUM}: <a href="{draftrow.U_VIEW}">{draftrow.TITLE}</a>
					<!-- ELSEIF S_PRIVMSGS -->
					<!-- ELSE -->{L_NO_TOPIC_FORUM}<!-- ENDIF -->
				</p>
				<p>{draftrow.DATE} &bull; <!-- IF draftrow.U_INSERT --><a href="{draftrow.U_INSERT}">{L_LOAD_DRAFT}</a> &bull; <!-- ENDIF --><a href="{draftrow.U_VIEW_EDIT}">{L_VIEW_EDIT}</a></p>
				<label><input type="checkbox" name="d[{draftrow.DRAFT_ID}]" id="d{draftrow.DRAFT_ID}" /> {L_MARK}</label>
			</div>
		<!-- END draftrow -->
		</div>
	<!-- ELSE -->
		<p><strong>{L_NO_SAVED_DRAFTS}</strong></p>
	<!-- ENDIF -->
	</div>
</div>

	<!-- IF .draftrow -->
	<div class="ucp-card">
		<div class="ucp-card-body">
			<div class="ucp-actions">
				<input class="button2" type="submit" name="delete" value="{L_DELETE_MARKED}" />
				<a href="javascript:void(0)" data-action="marklist" data-mark-form="postform" data-mark-name="" data-mark-state="true">{L_MARK_ALL}</a>
				<a href="javascript:void(0)" data-action="marklist" data-mark-form="postform" data-mark-name="" data-mark-state="false">{L_UNMARK_ALL}</a>
			</div>
			{S_FORM_TOKEN}
		</div>
	</div>
	<!-- ENDIF -->

<!-- ENDIF -->

</form>

<!-- INCLUDE ucp_footer.html -->
