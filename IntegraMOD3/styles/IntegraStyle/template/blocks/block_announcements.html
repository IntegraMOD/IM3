<div class="news">
	<a id="start" name="start" accesskey="t"></a>
	<!-- IF S_ANNOUNCEMENTS_COUNT_RETURNED == 0 -->
		<div class="genmed" style="text-align:center;"><strong>{L_NO_ANNOUNCEMENTS}</strong></div>
	<!-- ELSE -->
	<!-- BEGIN announce_row -->
		<!-- IF announce_row.S_TOPIC_TYPE != 3 -->
            <article class="announce portal-news-card <!-- IF announce_row.S_ROW_COUNT is even -->bg1a<!-- ELSE -->bg2a<!-- ENDIF -->">
			<!-- ELSE -->
            <article class="announce portal-news-card bg3a">
			<!-- ENDIF -->
                <div class="portal-news-inner">
					<div class="news_header" style="width:100%;">
						<span class="news_title">
							<!-- IF announce_row.S_TOPIC_TYPE == 3 -->
							<span class="red"> {announce_row.TITLE}</span>
							<!-- ELSE -->
							<span class="black"> {announce_row.TITLE}</span>
							<!-- ENDIF -->
						</span>
						<span class="news_time">  {announce_row.TIME}</span>
					</div>
					<div class="news_body">
						<div class="news" style="width:100%;">
							<div class="announce_box">

						<!-- IF announce_row.S_TOPIC_TYPE == 3 -->
							<img src="{T_IMAGESET_LANG_PATH}/news/announcement.png" alt="" />
						<!-- ELSE -->
							<img src="{T_IMAGESET_LANG_PATH}/news/announcement2.png" alt="" />
						<!-- ENDIF -->

							</div>
							<div class="contents">{announce_row.MESSAGE}</div>
							<!-- IF announce_row.S_HAS_ATTACHMENTS -->
							<div class="highslide-gallery">
								<div class="attachbox">
									<div class="attachbox-title">{L_ATTACHMENTS}</div>
									<!-- BEGIN attachment -->
										<div>{announce_row.attachment.DISPLAY_ATTACHMENT}</div>
									<!-- END attachment -->
								</div>
							</div>
							<!-- ENDIF -->
							<!-- IF announce_row.S_DISPLAY_NOTICE --><div class="rules">{L_DOWNLOAD_NOTICE}</div><!-- ENDIF -->
						</div>
					</div>
					<div class="news_footer" style="width:100%;">
						<span class="news_poster" style="width:50%;"> {L_POSTED_BY}: {announce_row.U_POSTER}</span>
						<span class="news_reply" style="width:50%;">
							<a href="{announce_row.U_VIEW}" title="{L_VIEW_FULL_ARTICLE}"><svg class="css-icon" aria-hidden="true" focusable="false"><use href="#icon-topic"></use></svg></a>
							<a href="{announce_row.U_PRINT}" title="{L_PRINT_IT}"><svg class="css-icon" aria-hidden="true" focusable="false"><use href="#icon-clipboard"></use></svg></a>
							<!-- IF announce_row.ALLOW_REPLY -->
								<a href="{announce_row.U_REPLY}" title="{L_POST_COMMENTS}"><svg class="css-icon" aria-hidden="true" focusable="false"><use href="#icon-reply"></use></svg></a>
							<!-- ENDIF -->
							<a href="#start" title="Top"><svg class="css-icon" aria-hidden="true" focusable="false"><use href="#icon-arrow-up"></use></svg></a>
						</span>
					</div>
					<br class="clear" />
				</div>
			</article>
	<!-- END announce_row -->
	<!-- ENDIF -->
</div>
<!-- IF DEBUG_QUERIES --><div class="block_data">{ANNOUNCEMENYS_DEBUG}</div><!-- ENDIF -->

<!-- IDTAG ends block_announcements.html -->
