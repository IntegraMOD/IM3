<div class="block_data">
	<form method="post" action="{S_LOGIN_ACTION}" class="headerspace">

	<!-- IF not S_USER_LOGGED_IN and not S_IS_BOT -->

        <div class="portal-user-avatar"><img src="{T_THEME_PATH}/images/no_avatar.gif" alt="" /></div>
        <label for="username">{L_USERNAME}:</label>
        <div class="portal-form-row"><input type="text" tabindex="1" name="username" id="username" size="20" maxlength="40" value="{USERNAME}" class="inputbox autowidth" /></div>
        <label for="password">{L_PASSWORD}:</label>
        <div class="portal-form-row"><input type="password" tabindex="2" id="password" name="password" size="20" maxlength="25" class="inputbox autowidth" /></div>

		<!-- IF S_DISPLAY_FULL_LOGIN and (U_SEND_PASSWORD or U_RESEND_ACTIVATION) -->
            <!-- IF U_SEND_PASSWORD --><div class="portal-block-center"><a href="{U_SEND_PASSWORD}">{L_FORGOT_PASS}</a></div><!-- ENDIF -->
            <!-- IF U_RESEND_ACTIVATION --><div class="portal-block-center"><a href="{U_RESEND_ACTIVATION}">{L_RESEND_ACTIVATION}</a></div><!-- ENDIF -->
		<!-- ENDIF -->

		<!-- IF S_AUTOLOGIN_ENABLED -->
        <div class="portal-block-center">
			<label for="autologin">{L_LOG_ME_IN_SHORT}</label>
			<input type="checkbox" name="autologin" id="autologin" tabindex="4" class="checkbox" />
		</div>
		<!-- ENDIF -->
        <div class="portal-block-center">{S_HIDDEN_FIELDS}<input type="submit" class="button2" name="login" value="{L_LOGIN}" /></div>
        <div class="gensmall portal-block-center">{L_DONT_HAVE_ACCOUNT}<a href="ucp.php?cid=&amp;mode=register">{L_REGISTRATION}</a><br /></div>

	<!-- ENDIF -->

	<!-- IF S_USER_LOGGED_IN -->
        <div class="portal-user-avatar">
			<!-- IF AVATAR -->{AVATAR}<!-- ELSE --><img src="{T_THEME_PATH}/images/no_avatar.gif" alt="" /><!-- ENDIF -->
		</div>

        <div class="portal-block-center">
			<span class="welcome">
			{WELCOME_SITE}<br />
			<!-- IF USR_RANK_IMG -->{USR_RANK_TITLE}<br />{USR_RANK_IMG}<br /><!-- ENDIF -->
			{P_USERNAME_FULL}
			</span>
		</div>
        <div class="portal-user-meta"><!-- IF S_USER_LOGGED_IN -->{LAST_VISIT_DATE}<!-- ELSE -->{CURRENT_TIME}<!-- ENDIF --></div>
        <div class="portal-user-meta"><a href="{U_SEARCH_SELF}">{L_SEARCH_SELF}</a></div>
        <div class="portal-user-meta"><a href="{U_LOGIN_LOGOUT}"><svg class="css-icon" aria-hidden="true" focusable="false"><use href="#icon-power"></use></svg> {L_LOGIN_LOGOUT}</a></div>
	<!-- ENDIF -->
	{S_FORM_TOKEN}
	</form>
</div>
<!-- IDTAG ends block_user_information -->

<!-- IF DEBUG_QUERIES --><div class="block_data">{USER_INFORMATION_DEBUG}</div><!-- ENDIF -->
