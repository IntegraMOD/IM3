<div class="news">
	<a id="bstart" name="bstart" accesskey="t"></a>
	<!-- IF S_NEWS_COUNT_RETURNED == 0 -->
		<div class="genmed" style="text-align:center;"><strong>{L_NO_NEWS}</strong></div>
	<!-- ELSE -->
	<!-- BEGIN news_row -->
		<!-- IF news_row.S_TOPIC_TYPE != 3 -->
            <article class="news portal-news-card <!-- IF news_row.S_ROW_COUNT is even -->bg1a<!-- ELSE -->bg2a<!-- ENDIF -->">
			<!-- ELSE -->
            <article class="news portal-news-card bg3a">
			<!-- ENDIF -->
                <div class="portal-news-inner">
					<div class="news_header">
						<span class="news_title">
						<!-- IF news_row.CAT -->
							<!-- IF news_row.S_TOPIC_TYPE == 4 -->
								<span class="black">{news_row.TITLE}</span>
							<!-- ELSE -->
								<span class="red">{news_row.TITLE}</span>
							<!-- ENDIF -->
						<!-- ENDIF -->
						</span>
						<span class="news_time">{news_row.TIME}</span>
					</div>
					<div class="news_body">
						<div class="news" style="width:100%;">
							<div class="news_box">
								<!-- IF news_row.S_TOPIC_TYPE == 4 -->
									<img src="{T_IMAGESET_LANG_PATH}/news/generalnews2.png" alt="" />
								<!-- ELSE -->
									<img src="{T_IMAGESET_LANG_PATH}/news/generalnews.png" alt="" />
								<!-- ENDIF -->
							</div>
							<div class="contents">{news_row.MESSAGE}</div>
							<!-- IF news_row.S_HAS_ATTACHMENTS -->
							<div class="highslide-gallery">
								<div class="attachbox">
									<div class="attachbox-title">{L_ATTACHMENTS}</div>
									<!-- BEGIN attachment -->
										<div>{news_row.attachment.DISPLAY_ATTACHMENT}</div>
									<!-- END attachment -->
								</div>
							</div>
							<!-- ENDIF -->
							<!-- IF news_row.S_DISPLAY_NOTICE --><div class="rules">{L_DOWNLOAD_NOTICE}</div><!-- ENDIF -->
						</div>
					</div>
					<div class="news_footer" style="width:100%;">
						<span class="news_poster" style="width:50%;"> {L_POSTED_BY}: {news_row.U_POSTER}</span>
						<span class="news_reply" style="width:50%;">
							<a href="{news_row.U_VIEW}" title="{L_VIEW_FULL_ARTICLE}"><svg class="css-icon" aria-hidden="true" focusable="false"><use href="#icon-topic"></use></svg></a>
							<a href="{news_row.U_PRINT}" title="{L_PRINT_IT}"><svg class="css-icon" aria-hidden="true" focusable="false"><use href="#icon-clipboard"></use></svg></a>
							<!-- IF news_row.ALLOW_REPLY -->
								<a href="{news_row.U_REPLY}" title="{L_POST_COMMENTS}"><svg class="css-icon" aria-hidden="true" focusable="false"><use href="#icon-reply"></use></svg></a>
							<!-- ENDIF -->
							<a href="#bstart" title="Top"><svg class="css-icon" aria-hidden="true" focusable="false"><use href="#icon-arrow-up"></use></svg></a>
						</span>
					</div>

					<br class="clear" />
				</div>
			</article>
	<!-- END news_row -->
	<!-- ENDIF -->
</div>
<!-- IF DEBUG_QUERIES --><div class="block_data">{NEWS_ADVANCED_DEBUG}</div><!-- ENDIF -->

<!-- IDTAG ends block_news.html -->
