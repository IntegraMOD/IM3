<!-- INCLUDE ucp_header.html -->

<form id="ucp" method="post" action="{S_UCP_ACTION}"{S_FORM_ENCTYPE}>

<h2>{L_TITLE}</h2>
<div class="ucp-card">
	<div class="ucp-card-body">
		<!-- IF ERROR --><p class="error">{ERROR}</p><!-- ENDIF -->
		<div class="ucp-form-grid">
			<div class="ucp-form-row"><label class="ucp-form-label" for="bbcode1">{L_DEFAULT_BBCODE}</label><div class="ucp-form-inline"><label for="bbcode1"><input type="radio" name="bbcode" id="bbcode1" value="1"<!-- IF S_BBCODE --> checked="checked"<!-- ENDIF --> /> {L_YES}</label><label for="bbcode0"><input type="radio" name="bbcode" id="bbcode0" value="0"<!-- IF not S_BBCODE --> checked="checked"<!-- ENDIF --> /> {L_NO}</label></div></div>
			<div class="ucp-form-row"><label class="ucp-form-label" for="smilies1">{L_DEFAULT_SMILIES}</label><div class="ucp-form-inline"><label for="smilies1"><input type="radio" name="smilies" id="smilies1" value="1"<!-- IF S_SMILIES --> checked="checked"<!-- ENDIF --> /> {L_YES}</label><label for="smilies0"><input type="radio" name="smilies" id="smilies0" value="0"<!-- IF not S_SMILIES --> checked="checked"<!-- ENDIF --> /> {L_NO}</label></div></div>
			<div class="ucp-form-row"><label class="ucp-form-label" for="sig1">{L_DEFAULT_ADD_SIG}</label><div class="ucp-form-inline"><label for="sig1"><input type="radio" name="sig" id="sig1" value="1"<!-- IF S_SIG --> checked="checked"<!-- ENDIF --> /> {L_YES}</label><label for="sig0"><input type="radio" name="sig" id="sig0" value="0"<!-- IF not S_SIG --> checked="checked"<!-- ENDIF --> /> {L_NO}</label></div></div>
			<div class="ucp-form-row"><label class="ucp-form-label" for="notify1">{L_DEFAULT_NOTIFY}</label><div class="ucp-form-inline"><label for="notify1"><input type="radio" name="notify" id="notify1" value="1"<!-- IF S_NOTIFY --> checked="checked"<!-- ENDIF --> /> {L_YES}</label><label for="notify0"><input type="radio" name="notify" id="notify0" value="0"<!-- IF not S_NOTIFY --> checked="checked"<!-- ENDIF --> /> {L_NO}</label></div></div>
		</div>
	</div>
</div>

<!-- MOD : MSSTI ABBC3 (v{S_ABBC3_VERSION}) - Start //-->
<!-- IF S_ABBC3_MOD and S_ABBC3_UCP_MODE -->
<h2>{L_UCP_ABBCODES}</h2>
<div class="ucp-card">
	<div class="ucp-card-body">
		<div class="ucp-form-row">
			<label class="ucp-form-label" for="abbcode_mod">{L_UCP_ABBC3_SETTINGS}</label>
			<p class="ucp-form-help">{L_UCP_ABBC3_SETTINGS_EXPLAIN}</p>
			<select class="ucp-form-select" name="abbcode_mod" id="abbcode_mod">{S_ABBCODE_OPTIONS}</select>
		</div>
	</div>
</div>
<!-- ENDIF -->
<!-- MOD : MSSTI ABBC3 (v{S_ABBC3_VERSION}) - End //-->
<div class="ucp-card">
	<div class="ucp-card-body">
		<div class="ucp-actions">
			{S_HIDDEN_FIELDS}
			<input type="reset" value="{L_RESET}" name="reset" class="button2" />
			<input type="submit" name="submit" value="{L_SUBMIT}" class="button1" />
		</div>
		{S_FORM_TOKEN}
	</div>
</div>
</form>

<!-- INCLUDE ucp_footer.html -->
