<!-- DEFINE $INCLUDEDED_JQUERY_SORTABLES_CAPTCHA = true -->
<section class="sortables-captcha" id="sortables-captcha" data-touch-punch="{ROOT_PATH}assets/js/jquery/jquery-ui-touch-punch.min.js">
    <header class="sortables-captcha-header">
        <p class="sortables-captcha-kicker">{L_CAPTCHA_SORTABLES}</p>
        <h3 class="sortables-captcha-title">{SORTABLES_CONFIRM_QUESTION}</h3>
        <p class="sortables-captcha-help sortables-captcha-help-js">{L_CONFIRM_QUESTION_EXPLAIN}</p>
    </header>
    <div class="sortables-captcha-body">
        <noscript>
            <p class="sortables-captcha-help">{L_CONFIRM_QUESTION_EXPLAIN_NOJS}</p>
            <div class="sortables-captcha-fallback">
                <div class="sortables-captcha-fallback-headers">
                    <strong><!-- IF SORTABLES_NAME_LEFT -->{SORTABLES_NAME_LEFT}<!-- ELSE -->{L_COLUMN_LEFT}<!-- ENDIF --></strong>
                    <strong><!-- IF SORTABLES_NAME_RIGHT -->{SORTABLES_NAME_RIGHT}<!-- ELSE -->{L_COLUMN_RIGHT}<!-- ENDIF --></strong>
                </div>
                <!-- BEGIN options -->
                <div class="sortables-captcha-fallback-row">
                    <input type="checkbox" name="sortables_options_left[]" value="{options.ID}" />
                    <span>{options.TEXT}</span>
                    <input type="checkbox" name="sortables_options_right[]" value="{options.ID}" />
                </div>
                <!-- END options -->
            </div>
        </noscript>

        <div class="sortables-captcha-js" id="enable_js" hidden>
            <div class="sortables-captcha-boxes">
                <div class="sortables_captcha_box">
                    <strong class="sortables-captcha-column-title"><!-- IF SORTABLES_NAME_LEFT -->{SORTABLES_NAME_LEFT}<!-- ELSE -->{L_COLUMN_LEFT}<!-- ENDIF --></strong>
                    <ul id="sortable1" class="connectedSortable">
                    <!-- IF SORTABLES_DEFAULT_SORT == 'LEFT' -->
                        <!-- BEGIN options -->
                        <li class="sortables-captcha-item" id="answer_{options.ID}">{options.TEXT}</li>
                        <!-- END options -->
                    <!-- ENDIF -->
                    </ul>
                </div>
                <div class="sortables_captcha_box">
                    <strong class="sortables-captcha-column-title"><!-- IF SORTABLES_NAME_RIGHT -->{SORTABLES_NAME_RIGHT}<!-- ELSE -->{L_COLUMN_RIGHT}<!-- ENDIF --></strong>
                    <ul id="sortable2" class="connectedSortable">
                    <!-- IF SORTABLES_DEFAULT_SORT == 'RIGHT' -->
                        <!-- BEGIN options -->
                        <li class="sortables-captcha-item" id="answer_{options.ID}">{options.TEXT}</li>
                        <!-- END options -->
                    <!-- ENDIF -->
                    </ul>
                </div>
            </div>
            <input type="hidden" name="sortables_confirm_id" id="confirm_id" value="{SORTABLES_CONFIRM_ID}" />
            <div id="sortables_options_left"></div>
            <div id="sortables_options_right"></div>
        </div>
    </div>
</section>
