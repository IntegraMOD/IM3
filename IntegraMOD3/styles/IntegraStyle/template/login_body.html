<!-- INCLUDE overall_header.html -->

<form action="{S_LOGIN_ACTION}" method="post" id="login" class="ucp-form-grid login-form-grid">
    <div class="ucp-card">
        <div class="ucp-card-body">
            <h2><!-- IF LOGIN_EXPLAIN -->{LOGIN_EXPLAIN}<!-- ELSE -->{L_LOGIN}<!-- ENDIF --></h2>

            <div class="ucp-form-grid login-form-grid">
                <!-- IF LOGIN_ERROR --><p class="error">{LOGIN_ERROR}</p><!-- ENDIF -->

                <div class="ucp-form-row">
                    <label class="ucp-form-label" for="{USERNAME_CREDENTIAL}">{L_USERNAME}</label>
                    <input type="text" tabindex="1" name="{USERNAME_CREDENTIAL}" id="{USERNAME_CREDENTIAL}" size="25" value="{USERNAME}" class="inputbox ucp-form-input" title="{L_USERNAME}" <!-- IF not S_ADMIN_AUTH -->autofocus<!-- ENDIF --> />
                </div>

                <div class="ucp-form-row">
                    <label class="ucp-form-label" for="{PASSWORD_CREDENTIAL}">{L_PASSWORD}</label>
                    <input type="password" tabindex="2" id="{PASSWORD_CREDENTIAL}" name="{PASSWORD_CREDENTIAL}" size="25" class="inputbox ucp-form-input" title="{L_PASSWORD}" <!-- IF S_ADMIN_AUTH -->autofocus<!-- ENDIF --> />
                    <!-- IF S_DISPLAY_FULL_LOGIN and (U_SEND_PASSWORD or U_RESEND_ACTIVATION) -->
                        <div class="ucp-form-inline">
                            <!-- IF U_SEND_PASSWORD --><a href="{U_SEND_PASSWORD}">{L_FORGOT_PASS}</a><!-- ENDIF -->
                            <!-- IF U_RESEND_ACTIVATION --><a href="{U_RESEND_ACTIVATION}">{L_RESEND_ACTIVATION}</a><!-- ENDIF -->
                        </div>
                    <!-- ENDIF -->
                </div>

                <!-- IF CAPTCHA_TEMPLATE and S_CONFIRM_CODE -->
                    <!-- DEFINE $CAPTCHA_TAB_INDEX = 3 -->
                    <!-- INCLUDE {CAPTCHA_TEMPLATE} -->
                <!-- ENDIF -->

                <!-- IF S_DISPLAY_FULL_LOGIN -->
                    <div class="ucp-form-row">
                        <div class="ucp-form-inline">
                            <!-- IF S_AUTOLOGIN_ENABLED --><label for="autologin"><input type="checkbox" name="autologin" id="autologin" tabindex="4" /> {L_LOG_ME_IN}</label><!-- ENDIF -->
                            <label for="viewonline"><input type="checkbox" name="viewonline" id="viewonline" tabindex="5" /> {L_HIDE_ME}</label>
                        </div>
                    </div>
                <!-- ENDIF -->

                {S_LOGIN_REDIRECT}

                <div class="ucp-actions">
                    {S_HIDDEN_FIELDS}
                    <input type="submit" name="login" tabindex="6" value="{L_LOGIN}" class="button1 default-submit-action" />
                </div>
            </div>
        </div>
    </div>

    <!-- IF not S_ADMIN_AUTH and S_REGISTER_ENABLED -->
        <div class="ucp-card">
            <div class="ucp-card-body">
                <h3>{L_REGISTER}</h3>
                <p>{L_LOGIN_INFO}</p>
                <p><strong><a href="{U_TERMS_USE}">{L_TERMS_USE}</a> | <a href="{U_PRIVACY}">{L_PRIVACY}</a></strong></p>
                <div class="ucp-actions">
                    <a href="{U_REGISTER}" class="button2">{L_REGISTER}</a>
                </div>
            </div>
        </div>
    <!-- ENDIF -->
</form>

<!-- INCLUDE overall_footer.html -->
