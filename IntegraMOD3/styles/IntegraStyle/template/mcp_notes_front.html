<!-- INCLUDE mcp_header.html -->

<form method="post" id="mcp" action="{U_POST_ACTION}">
    <h2>{L_TITLE}</h2>
    <section class="ucp-card">
        <div class="ucp-card-body">
            <div class="ucp-form-grid">
                <div class="ucp-form-row">
                    <label class="ucp-form-label" for="username">{L_SELECT_USER}:</label>
                    <input name="username" id="username" type="text" class="inputbox ucp-form-input" />
                    <p><strong><a href="{U_FIND_USERNAME}" data-find-username>{L_FIND_USERNAME}</a></strong></p>
                </div>
            </div>
        </div>
    </section>
    <div class="ucp-actions">
        <input type="reset" value="{L_RESET}" name="reset" class="button2" />
        <input type="submit" name="submituser" value="{L_SUBMIT}" class="button1" />
        {S_FORM_TOKEN}
    </div>
</form>

<!-- INCLUDE mcp_footer.html -->
