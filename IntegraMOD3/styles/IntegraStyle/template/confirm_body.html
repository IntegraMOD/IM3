<!-- INCLUDE overall_header.html -->

<form id="confirm" action="{S_CONFIRM_ACTION}" method="post" class="ucp-form-grid">
    <div class="ucp-card">
        <div class="ucp-card-body">
            <h2>{MESSAGE_TITLE}</h2>
            <div class="ucp-form-grid">
                <p>{MESSAGE_TEXT}</p>
                <div class="ucp-actions">
                    {S_HIDDEN_FIELDS}
                    <input type="submit" name="confirm" value="{L_YES}" class="button1" />
                    <input type="submit" name="cancel" value="{L_NO}" class="button2" />
                </div>
            </div>
        </div>
    </div>
</form>

<!-- INCLUDE overall_footer.html -->
