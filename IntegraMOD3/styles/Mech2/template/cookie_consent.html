<div id="cookie-consent-modal" class="cookie-consent-modal cookie-consent-{COOKIE_CONSENT_POSITION} cookie-consent-hidden" role="dialog" aria-modal="true" aria-labelledby="cookie-consent-title">
	<div class="cookie-consent-content">
		<div class="cookie-consent-header">
			<h3 id="cookie-consent-title">{COOKIE_CONSENT_TITLE}</h3>
		</div>
		<div class="cookie-consent-body">
			<p>{COOKIE_CONSENT_MESSAGE}</p>
		</div>
		<div class="cookie-consent-footer">
			<button type="button" class="cookie-accept-btn" aria-label="{COOKIE_CONSENT_ACCEPT_TEXT}">{COOKIE_CONSENT_ACCEPT_TEXT}</button>
			<button type="button" class="cookie-decline-btn" aria-label="{COOKIE_CONSENT_DECLINE_TEXT}">{COOKIE_CONSENT_DECLINE_TEXT}</button>
		</div>
	</div>
</div>
