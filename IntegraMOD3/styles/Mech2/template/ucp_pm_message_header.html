<h2>{L_TITLE}<!-- IF CUR_FOLDER_NAME -->: {CUR_FOLDER_NAME}<!-- ENDIF --></h2>

<form id="viewfolder" method="post" action="{S_PM_ACTION}">

	<div class="ucp-card">
		<div class="ucp-card-body">

			<!-- IF FOLDER_STATUS and FOLDER_MAX_MESSAGES neq 0 --><p>{FOLDER_STATUS}</p><!-- ENDIF -->
			<!-- IF U_POST_REPLY_PM or U_POST_NEW_TOPIC or U_FORWARD_PM -->
				<div class="buttons">
					<!-- IF U_POST_REPLY_PM -->
						<div class="reply-icon">
							<a title="{L_POST_REPLY_PM}" href="{U_POST_REPLY_PM}"><svg class="css-icon css-icon-reply" aria-hidden="true" focusable="false"><use href="#icon-reply"></use></svg>{L_POST_REPLY_PM}</a>
						</div>
					<!-- ELSEIF U_POST_NEW_TOPIC -->
						<div class="post-icon">
							<a href="{U_POST_NEW_TOPIC}" accesskey="n" title="{L_UCP_PM_COMPOSE}"><svg class="css-icon css-icon-edit" aria-hidden="true" focusable="false"><use href="#icon-edit"></use></svg>{L_UCP_PM_COMPOSE}</a>
						</div>
					<!-- ENDIF -->
					<!-- IF U_FORWARD_PM -->
						<div class="post-icon">
							<a title="{L_POST_FORWARD_PM}" href="{U_FORWARD_PM}"><svg class="css-icon css-icon-arrow-right" aria-hidden="true" focusable="false"><use href="#icon-arrow-right"></use></svg>{L_FORWARD_PM}</a>
						</div>
					<!-- ENDIF -->
					<!-- IF U_POST_REPLY_PM and S_PM_RECIPIENTS gt 1 -->
						<div class="reply-icon">
							<a title="{L_REPLY_TO_ALL}" href="{U_POST_REPLY_ALL}"><svg class="css-icon css-icon-reply" aria-hidden="true" focusable="false"><use href="#icon-reply"></use></svg>{L_REPLY_TO_ALL}</a>
						</div>
					<!-- ENDIF -->
				</div>
			<!-- ENDIF -->
			<!-- IF TOTAL_MESSAGES or S_VIEW_MESSAGE -->
				<ul class="linklist">
					<li class="rightside pagination">
						<!-- IF S_VIEW_MESSAGE --><a class="{S_CONTENT_FLOW_BEGIN}" href="{U_CURRENT_FOLDER}">{L_RETURN_TO} {CUR_FOLDER_NAME}</a><!-- ENDIF -->
						<!-- IF FOLDER_CUR_MESSAGES neq 0 -->
							<!-- IF TOTAL_MESSAGES -->{TOTAL_MESSAGES}<!-- ENDIF -->
							<!-- IF PAGE_NUMBER -->
								<!-- IF PAGINATION -->
									&bull; <a href="javascript:void(0)" data-action="jumpto" title="{L_JUMP_TO_PAGE}">{PAGE_NUMBER}</a> &bull; <span>{PAGINATION}
									</span>
								<!-- ELSE -->
									&bull; {PAGE_NUMBER}
								<!-- ENDIF -->
							<!-- ENDIF -->
						<!-- ENDIF -->
					</li>
				</ul>
			<!-- ENDIF -->

		</div>
	</div>
